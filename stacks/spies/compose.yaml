name: spies

services:
  spies:
    restart: unless-stopped
    image: ghcr.io/society-for-internet-blaseball-research/houstonspies.cyou:latest
    read_only: true
    labels:
      traefik.enable: true
      traefik.http.routers.spies.entrypoints: https
      traefik.http.routers.spies.rule: Host(`houstonspies.cyou`)
      #traefik.http.services.spies.loadbalancer.server.port: 80
      traefik.http.middlewares.spiesredirect.redirectregex.regex: "^.*"
      traefik.http.middlewares.spiesredirect.redirectregex.replacement: "https://outage.sibr.dev"
      traefik.http.routers.spies.middlewares: spiesredirect
    mem_limit: 512m
    networks:
    - proxy
networks:
  proxy:
    external: true
    name: proxy